[build]
  command = "npm run build"
  publish = "dist"
  # Belt-and-suspenders with [skip netlify] on pack/app checkpoint commits:
  # exit 0 = skip build, exit 1 = proceed.
  ignore = "git log -1 --pretty=%B | grep -qE '\\[skip netlify\\]|UI map pack ' && exit 0 || exit 1"

# Flutter web preview: static files under /app/ (from public/app).
# Netlify serves existing files before the SPA fallback below.
[[redirects]]
  from = "/app"
  to = "/app/"
  status = 301

[[redirects]]
  from = "/ui"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/ui/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/app/*"
  [headers.values]
    Cache-Control = "public, max-age=60, must-revalidate"

[[headers]]
  for = "/app/main.dart.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/app/flutter_bootstrap.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/app/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Screen captures + map thumbs. Paths are stable IDs (rewritten on capture), so no `immutable`.
[[headers]]
  for = "/screens/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"
