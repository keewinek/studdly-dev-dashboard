[build]
  command = "npm run build"
  publish = "dist"

# Flutter web preview: static files under /app/ (from public/app).
# Netlify serves existing files before the SPA fallback below.
[[redirects]]
  from = "/app"
  to = "/app/"
  status = 301

[[redirects]]
  from = "/ui"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/ui/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/app/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"
