name: Update UI map

# Runs on this *public* repo → free GitHub Actions minutes.
# Private studdly only fires a tiny trigger workflow (almost zero private minutes).
on:
  workflow_dispatch:
    inputs:
      studdly_sha:
        description: Studdly git SHA or branch to build (default main)
        required: false
        default: main
  repository_dispatch:
    types: [studdly-main-updated]

concurrency:
  group: update-ui-map
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update-ui-map:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Require STUDDLY_REPO_TOKEN
        env:
          TOKEN: ${{ secrets.STUDDLY_REPO_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Add repo secret STUDDLY_REPO_TOKEN (PAT with Contents: Read on private keewinek/studdly). See README."
            exit 1
          fi

      - name: Resolve Studdly ref
        id: studdly
        run: |
          REF="${{ github.event.inputs.studdly_sha }}"
          if [ -z "$REF" ] || [ "$REF" = "null" ]; then
            REF="${{ github.event.client_payload.sha }}"
          fi
          if [ -z "$REF" ] || [ "$REF" = "null" ]; then
            REF="main"
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "Building Studdly @ $REF"

      - name: Checkout dashboard
        uses: actions/checkout@v4
        with:
          # Need full history for rebase when pack-pushing mid-run.
          fetch-depth: 0

      - name: Checkout Studdly (private)
        uses: actions/checkout@v4
        with:
          repository: keewinek/studdly
          ref: ${{ steps.studdly.outputs.ref }}
          token: ${{ secrets.STUDDLY_REPO_TOKEN }}
          path: studdly

      - name: Resolve Studdly commit SHA
        id: sha
        run: |
          FULL="$(git -C studdly rev-parse HEAD)"
          echo "full=$FULL" >> "$GITHUB_OUTPUT"
          echo "short=${FULL:0:7}" >> "$GITHUB_OUTPUT"
          echo "Resolved Studdly SHA $FULL"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        working-directory: studdly
        run: flutter pub get

      - name: Build Flutter web UI preview
        working-directory: studdly
        run: |
          flutter build web \
            -t lib/ui_preview_main.dart \
            --base-href /app/ \
            --release \
            --pwa-strategy=none \
            --no-wasm-dry-run \
            --no-tree-shake-icons

      - name: Export UI preview catalog
        working-directory: studdly
        run: |
          dart run tool/export_ui_preview_catalog.dart --out "$GITHUB_WORKSPACE/src/preview_catalog.json"
          dart run tool/export_ui_preview_catalog.dart --out "$GITHUB_WORKSPACE/public/preview_catalog.json"

      - name: Sync preview into public/app
        run: |
          chmod +x scripts/sync-flutter-preview.sh
          SKIP_BUILD=1 SKIP_CATALOG_EXPORT=1 STUDDLY_ROOT="$GITHUB_WORKSPACE/studdly" \
            ./scripts/sync-flutter-preview.sh

      - name: Commit Flutter app build early
        run: |
          set -euo pipefail
          git config user.name "studdly-ui-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Ship /app before packs so mid-run screenshots match the new preview build
          # (cancel-in-progress must not leave new screens + old /app).
          # [skip netlify]: pack + early app pushes are git checkpoints; one final
          # leftovers/deploy commit (no skip tag) triggers a single Netlify build.
          git add public/app public/preview_catalog.json src/preview_catalog.json
          if git diff --cached --quiet; then
            echo "Flutter app build already up to date on main."
            exit 0
          fi
          git commit -m "chore: refresh UI map app build from studdly@${{ steps.sha.outputs.short }} [skip netlify]"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                echo "Pushed app build on attempt ${attempt}"
                exit 0
              fi
            else
              echo "Rebase conflict on attempt ${attempt} — keeping our app build"
              git checkout --theirs -- public/app public/preview_catalog.json src/preview_catalog.json
              git add public/app public/preview_catalog.json src/preview_catalog.json
              unresolved="$(git diff --name-only --diff-filter=U || true)"
              if [ -n "$unresolved" ]; then
                echo "::error::Unresolved conflicts: $unresolved"
                git rebase --abort || true
              else
                GIT_EDITOR=true git rebase --continue || git rebase --abort || true
              fi
            fi
            # If abort dropped the commit, recreate it before retrying.
            git add public/app public/preview_catalog.json src/preview_catalog.json
            if ! git diff --cached --quiet; then
              git commit -m "chore: refresh UI map app build from studdly@${{ steps.sha.outputs.short }} [skip netlify]" || true
            fi
            echo "Push race; retrying in 10s…"
            sleep 10
          done
          echo "::error::Failed to push app build after retries"
          exit 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install deps + Playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium
          node --check scripts/capture-screenshots.mjs

      - name: Serve preview and capture screenshots
        env:
          GITHUB_SHA: ${{ steps.sha.outputs.full }}
          CONCURRENCY: '4'
          SETTLE_MS: '2000'
          # Push screens + manifest after each locale×theme pack (e.g. light.en)
          # as git checkpoints ([skip netlify]). Live site updates on the final
          # leftovers/deploy commit below.
          COMMIT_EACH_PACK: '1'
        run: |
          set -euo pipefail
          git config user.name "studdly-ui-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rm -rf /tmp/ui-preview-root
          mkdir -p /tmp/ui-preview-root/app
          rsync -a --delete public/app/ /tmp/ui-preview-root/app/
          python3 -m http.server 7360 --bind 127.0.0.1 --directory /tmp/ui-preview-root >/tmp/preview-server.log 2>&1 &
          echo $! > /tmp/preview-server.pid
          trap 'kill "$(cat /tmp/preview-server.pid)" 2>/dev/null || true' EXIT

          ready=0
          for i in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:7360/app/" >/dev/null 2>/dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$(cat /tmp/preview-server.pid)" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "::error::Preview server on :7360 never became ready"
            echo "--- preview-server.log ---"
            cat /tmp/preview-server.log || true
            echo "--- /tmp/ui-preview-root ---"
            ls -la /tmp/ui-preview-root /tmp/ui-preview-root/app || true
            exit 1
          fi

          PREVIEW_BASE=http://127.0.0.1:7360/app/ \
            node scripts/capture-screenshots.mjs

          # Recover any missing WebP thumbs / rewrite PNG imageUrls after pack races.
          npm run thumbs:screens
          node scripts/point-manifest-thumbs.mjs

      - name: Commit remaining leftovers and deploy
        run: |
          set -euo pipefail
          git config user.name "studdly-ui-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Never `git add -A` — CI checks out private Studdly into ./studdly;
          # that would land as a broken private gitlink and stall Netlify.
          git add public/app public/screens public/manifest.json public/capture-report.json \
            public/preview_catalog.json src/preview_catalog.json
          if git diff --cached --quiet; then
            # Packs already pushed everything with [skip netlify]. Force one empty
            # deploy commit so Netlify builds the accumulated app + screens once.
            git commit --allow-empty -m "chore: deploy UI map from studdly@${{ steps.sha.outputs.short }}"
          else
            git commit -m "chore: refresh UI map leftovers from studdly@${{ steps.sha.outputs.short }}"
          fi

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                echo "Pushed leftovers/deploy on attempt ${attempt}"
                exit 0
              fi
            else
              echo "Rebase conflict on attempt ${attempt} — keeping our capture artifacts"
              git checkout --theirs -- public/screens public/capture-report.json public/app \
                public/preview_catalog.json src/preview_catalog.json
              if git show :2:public/manifest.json >/dev/null 2>&1; then
                node scripts/merge-manifest-conflict.mjs || git checkout --theirs -- public/manifest.json
              else
                git checkout --theirs -- public/manifest.json
              fi
              git add public/screens public/manifest.json public/capture-report.json public/app \
                public/preview_catalog.json src/preview_catalog.json
              unresolved="$(git diff --name-only --diff-filter=U || true)"
              if [ -n "$unresolved" ]; then
                echo "::error::Unresolved conflicts: $unresolved"
                git rebase --abort || true
              else
                GIT_EDITOR=true git rebase --continue || git rebase --abort || true
              fi
            fi
            git add public/app public/screens public/manifest.json public/capture-report.json \
              public/preview_catalog.json src/preview_catalog.json
            if ! git diff --cached --quiet; then
              git commit -m "chore: refresh UI map leftovers from studdly@${{ steps.sha.outputs.short }}" || true
            elif ! git log -1 --pretty=%B | grep -q 'deploy UI map\|refresh UI map leftovers'; then
              git commit --allow-empty -m "chore: deploy UI map from studdly@${{ steps.sha.outputs.short }}" || true
            fi
            echo "Push race; retrying in 10s…"
            sleep 10
          done
          echo "::error::Failed to push after retries"
          exit 1
