<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/app/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="studdly">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Studdly</title>
  <meta name="description" content="The Future of Learning">
  <link rel="manifest" href="manifest.json">

  <!--
    Tesseract.js OCR for Flutter web.

    Served from our own origin (web/vendor/, populated by tool/fetch_web_vendor.sh)
    rather than a public CDN: a CDN request would disclose the visitor's IP to a
    third party before any consent. workerPath / corePath / langPath must be set
    explicitly, because Tesseract otherwise fetches those at runtime from
    jsdelivr and tessdata.projectnaptha.com and the leak comes back.
  -->
  <script src="vendor/tesseract/tesseract.min.js"></script>
  <script>
    // Absolute URLs, so the paths still resolve inside Tesseract's web worker
    // and under a non-root --base-href.
    window.studdlyVendorBase = new URL('vendor/', document.baseURI).href;

    // Called from Dart via JS interop (lib/core/services/ocr/ocr_performer_web.dart)
    window.studdlyRecognizeText = async function (imageBytes, lang) {
      const bytes = imageBytes instanceof Uint8Array
        ? imageBytes
        : new Uint8Array(imageBytes);
      const blob = new Blob([bytes], { type: 'image/jpeg' });
      const vendor = window.studdlyVendorBase;
      const result = await Tesseract.recognize(blob, lang || 'eng+pol', {
        logger: function () {},
        workerPath: vendor + 'tesseract/worker.min.js',
        corePath: vendor + 'tesseract-core',
        langPath: vendor + 'tesseract-lang',
      });
      return (result && result.data && result.data.text) ? result.data.text : '';
    };
  </script>
</head>
<body>
  <!-- pdf.js, self-hosted for the same reason as Tesseract above. -->
  <script src='vendor/pdfjs/pdf.min.mjs' type='module'></script>
  <script type='module'>
  var { pdfjsLib } = globalThis;
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    new URL('vendor/pdfjs/pdf.worker.mjs', document.baseURI).href;
  </script>
  <script>
    // Clear stale Flutter service workers/caches before bootstrapping.
    (async function () {
      try {
        if ('serviceWorker' in navigator) {
          const regs = await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map((r) => r.unregister()));
        }
        if (window.caches) {
          const keys = await caches.keys();
          await Promise.all(keys.map((k) => caches.delete(k)));
        }
      } catch (_) {}
      const s = document.createElement('script');
      s.src = 'flutter_bootstrap.js';
      s.async = true;
      document.body.appendChild(s);
    })();
  </script>
</body>
</html>
